<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login</title>

<style>
body{
    font-family: Arial, sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:#f5f5f5;
}

.login-box{
    background:white;
    padding:30px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
    width:300px;
}

h2{
    text-align:center;
}

input{
    width:100%;
    padding:10px;
    margin:10px 0;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:10px;
    cursor:pointer;
}

#error{
    color:red;
    text-align:center;
    margin-top:10px;
}
</style>
</head>
<body>

<div class="login-box">

<h2>Admin Login</h2>

<input
type="email"
id="email"
placeholder="Enter Email">

<input
type="password"
id="password"
placeholder="Enter Password">

<button id="loginBtn">
Login
</button>

<p id="error"></p>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const supabaseUrl =
"https://dmlkmqiurqdoxcitosoh.supabase.co";

const supabaseKey =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRtbGttcWl1cnFkb3hjaXRvc29oIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwOTM0NzksImV4cCI6MjA5NjY2OTQ3OX0._ayWXPn6gYWOxmoSznBVb_2Mw6QmR-BbD0WKwc9UtWc";

const supabase =
window.supabase.createClient(
    supabaseUrl,
    supabaseKey
);

async function checkSession() {

    const {
        data: { session }
    } = await supabase.auth.getSession();

    if (session) {
        window.location.href =
        "dashboard.html";
    }
}

document
.getElementById("loginBtn")
.addEventListener("click", async () => {

    const email =
    document.getElementById("email").value;

    const password =
    document.getElementById("password").value;

    const { error } =
    await supabase.auth.signInWithPassword({
        email,
        password
    });

    if (error) {

        document.getElementById("error")
        .innerText = error.message;

        console.error(error);

        return;
    }

    window.location.href =
    "dashboard.html";
});

checkSession();

</script>

</body>
</html>
